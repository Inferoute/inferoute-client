name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # This is required for creating releases and uploading assets

jobs:
  build:
    name: Build Linux and Windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p build

          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y-%m-%d_%H:%M:%S')
          VERSION_FLAGS="-X github.com/sentnl/inferoute-node/inferoute-client/pkg/version.Version=$VERSION -X github.com/sentnl/inferoute-node/inferoute-client/pkg/version.Commit=$COMMIT -X github.com/sentnl/inferoute-node/inferoute-client/pkg/version.Date=$DATE"

          GOOS=linux GOARCH=amd64 go build -ldflags "$VERSION_FLAGS" -o build/inferoute-client-linux-amd64 ./cmd
          GOOS=linux GOARCH=arm64 go build -ldflags "$VERSION_FLAGS" -o build/inferoute-client-linux-arm64 ./cmd
          GOOS=windows GOARCH=amd64 go build -ldflags "$VERSION_FLAGS" -o build/inferoute-client-windows-amd64.exe ./cmd

          cd build
          zip -r inferoute-client-linux-amd64.zip inferoute-client-linux-amd64
          zip -r inferoute-client-linux-arm64.zip inferoute-client-linux-arm64
          zip -r inferoute-client-windows-amd64.zip inferoute-client-windows-amd64.exe
          cd ..
          tar -czf build/contract-${VERSION}.tar.gz -C pkg/contract testdata

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: |
            build/*.zip
            build/contract-*.tar.gz

  build-macos:
    name: Build macOS
    # The macOS GPU power/temperature reader uses cgo, which needs Apple's
    # compiler and SDK, so these binaries cannot be cross-built on Linux.
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p build

          VERSION=${GITHUB_REF#refs/tags/v}
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +'%Y-%m-%d_%H:%M:%S')
          VERSION_FLAGS="-X github.com/sentnl/inferoute-node/inferoute-client/pkg/version.Version=$VERSION -X github.com/sentnl/inferoute-node/inferoute-client/pkg/version.Commit=$COMMIT -X github.com/sentnl/inferoute-node/inferoute-client/pkg/version.Date=$DATE"

          # Apple Silicon (native on the runner)
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -ldflags "$VERSION_FLAGS" -o build/inferoute-client-darwin-arm64 ./cmd
          # Intel
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="clang -arch x86_64" go build -ldflags "$VERSION_FLAGS" -o build/inferoute-client-darwin-amd64 ./cmd

          # Fail the release if a binary came out for the wrong CPU.
          lipo -archs build/inferoute-client-darwin-arm64 | grep -qx arm64
          lipo -archs build/inferoute-client-darwin-amd64 | grep -qx x86_64

          cd build
          zip -r inferoute-client-darwin-amd64.zip inferoute-client-darwin-amd64
          zip -r inferoute-client-darwin-arm64.zip inferoute-client-darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: build/*.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-macos]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true

      - name: Checksums
        run: cd build && sha256sum *.zip > checksums.txt

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/inferoute-client-linux-amd64.zip
            build/inferoute-client-linux-arm64.zip
            build/inferoute-client-darwin-amd64.zip
            build/inferoute-client-darwin-arm64.zip
            build/inferoute-client-windows-amd64.zip
            build/checksums.txt
            build/contract-*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: ${{ github.workspace }}/CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: release
    # v1.2.0-test style tags are disposable client-update tests. They must not
    # move inferoute/inferoute-client:latest, :1, or :1.2 on Docker Hub.
    if: ${{ !contains(github.ref_name, '-') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Extract version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: inferoute/inferoute-client
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            latest
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RELEASE_VERSION=${{ env.RELEASE_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
